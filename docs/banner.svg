<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HYDRA — key rotator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07080B"/>
      <stop offset="0.55" stop-color="#0A0E18"/>
      <stop offset="1" stop-color="#0C1220"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 20) rotate(35) scale(520 380)">
      <stop offset="0" stop-color="#4C8DFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 340) rotate(-140) scale(460 320)">
      <stop offset="0" stop-color="#33D6C4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#33D6C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="76" y1="92" x2="152" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5C97FF"/>
      <stop offset="1" stop-color="#2A5BC4"/>
    </linearGradient>
    <linearGradient id="word" x1="180" y1="110" x2="560" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9FC0FF"/>
    </linearGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C8DFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#6FD1FF" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="barB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3B13C" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFD08A" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glowA)"/>
  <rect width="1280" height="360" fill="url(#glowB)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <!-- mark -->
  <rect x="76" y="92" width="76" height="76" rx="20" fill="url(#mark)" fill-opacity="0.22" stroke="#7AA8FF" stroke-opacity="0.45"/>
  <rect x="92" y="108" width="11" height="44" rx="3.5" fill="#DCE9FF"/>
  <rect x="125" y="108" width="11" height="44" rx="3.5" fill="#DCE9FF"/>
  <rect x="103" y="124" width="22" height="11" rx="3.5" fill="#DCE9FF"/>

  <!-- wordmark -->
  <text x="180" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="11" fill="url(#word)">HYDRA</text>
  <text x="183" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#94A2BA">One endpoint. One key. Every upstream key behind it.</text>

  <!-- chips -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">
    <rect x="183" y="208" width="152" height="28" rx="14" fill="#4C8DFF" fill-opacity="0.10" stroke="#4C8DFF" stroke-opacity="0.35"/>
    <text x="199" y="226" fill="#A9C6FF">openai-compatible</text>
    <rect x="345" y="208" width="92" height="28" rx="14" fill="#33D6C4" fill-opacity="0.08" stroke="#33D6C4" stroke-opacity="0.30"/>
    <text x="361" y="226" fill="#8CE4DA">anthropic</text>
    <rect x="447" y="208" width="126" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="463" y="226" fill="#B7C1D2">zero deps</text>
    <rect x="583" y="208" width="84" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="599" y="226" fill="#B7C1D2">EN / RU</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <circle cx="190" cy="258" r="3" fill="#38D39F"/>
    <text x="202" y="263" font-size="13.5" fill="#9FB0C8">KeyRotatorBench <tspan fill="#DCE9FF" font-weight="700">#1 of 3</tspan> · 86.68 / 100</text>
  </g>

  <!-- mini panel -->
  <g>
    <rect x="800" y="84" width="404" height="192" rx="18" fill="#FFFFFF" fill-opacity="0.028" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <text x="828" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#7C8AA3">POOL · 120 KEYS</text>
    <text x="1090" y="116" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#8DEFC8">7 200 rpm</text>

    <!-- row 1 -->
    <circle cx="836" cy="146" r="3.5" fill="#38D39F"/>
    <text x="850" y="150" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#CFD8E6">openai-01</text>
    <rect x="948" y="143" width="150" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="948" y="143" width="54" height="4" rx="2" fill="url(#barA)"/>
    <text x="1112" y="150" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#7C8AA3">18 / 60</text>

    <!-- row 2 -->
    <circle cx="836" cy="180" r="3.5" fill="#38D39F"/>
    <text x="850" y="184" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#CFD8E6">claude-03</text>
    <rect x="948" y="177" width="150" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="948" y="177" width="106" height="4" rx="2" fill="url(#barA)"/>
    <text x="1112" y="184" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#7C8AA3">42 / 60</text>

    <!-- row 3 -->
    <circle cx="836" cy="214" r="3.5" fill="#F3B13C"/>
    <text x="850" y="218" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#CFD8E6">free-tier-2</text>
    <rect x="948" y="211" width="150" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="948" y="211" width="140" height="4" rx="2" fill="url(#barB)"/>
    <text x="1112" y="218" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#7C8AA3">3 / 3</text>

    <!-- row 4 -->
    <circle cx="836" cy="248" r="3.5" fill="#38D39F"/>
    <text x="850" y="252" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#CFD8E6">openai-17</text>
    <rect x="948" y="245" width="150" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="948" y="245" width="27" height="4" rx="2" fill="url(#barA)"/>
    <text x="1112" y="252" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#7C8AA3">9 / 60</text>
  </g>
</svg>