name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Integration tests
        run: node test/run.js

      - name: Security tests
        run: node test/security.js

      - name: Bench (smoke)
        run: npm run bench
        env:
          REQUESTS: 500
          CONCURRENCY: 32
