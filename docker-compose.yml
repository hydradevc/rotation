services:
  hydra:
    build: .
    image: hydra-rotator:latest
    container_name: hydra
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Set before the first start; the panel password is derived from it once.
      HYDRA_ADMIN_PASSWORD: "change-me-before-first-start"
      # 32 random bytes, hex or base64. Keeps secrets decryptable across containers.
      # HYDRA_MASTER_KEY: ""
      HYDRA_DATA: /data
      HYDRA_SECURE_COOKIES: "auto"
    volumes:
      - hydra-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  hydra-data:
